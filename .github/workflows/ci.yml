name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Compile source
        run: python -m compileall -q tennis_predictor tests
      - name: Run tests
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=85
      - name: Run CLI smoke test
        run: >-
          tennis-predictor --players examples/players.csv --simulations 200
          --seed 42 --output results/forecast.csv

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check and lint
        run: |
          pnpm exec tsc --noEmit
          pnpm lint
      - name: Test the probabilistic engine
        run: pnpm test:model
      - name: Build and test rendered output
        run: |
          pnpm build
          node --test tests/rendered-html.test.mjs
